  intl: ^0.19.0  # Para formatear fechas
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.0
  share_plus: ^7.0.0  
  qr_code_scanner: ^1.0.0 # (opcional) para subir fotos
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
