name: app_movil
description: "Vibra Pay - App de pagos"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0
  ndef: ^0.4.0   
  http: ^1.1.0
  provider: ^6.0.5
  flutter_secure_storage: ^10.3.1
  local_auth: ^2.1.6
  flutter_nfc_kit: ^3.6.2  # opcional
  qr_flutter: ^4.1.0 
  supabase_flutter: ^2.8.0         # Para generar QR     
  image: ^4.0.0  # Para comprimir la imagen
  intl: ^0.19.0  # Para formatear fechas
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  archive: ^3.4.10        # Para crear archivos ZIP
  share_plus: ^13.3.0      # Para compartir archivos
  dio: ^5.4.0             # Para descargar archivos de forma eficiente 
  cross_file: ^0.3.4  # Si share_plus no exporta XFile, lo añadimos
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
