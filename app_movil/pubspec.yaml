publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0

  http: ^1.1.0
  provider: ^6.0.5
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.6
  flutter_nfc_kit: ^3.6.2  # opcional
  qr_flutter: ^4.1.0 
  supabase_flutter: ^2.8.0         # Para generar QR     
